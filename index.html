<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation Agent (Multi-AI) v2.1</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --border2: #3a3a3a;
    --text: #e8e4dc;
    --muted: #7a7670;
    --accent: #c8b98a;
    --accent-dim: #8a7d5a;
    --green: #4a9e6e;
    --red: #c05a4a;
    --blue: #5a8ab5;
    --purple: #8a7db5;
    --radius: 10px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2.5rem 1rem 4rem;
  }

  .container { width: 100%; max-width: 700px; }

  .header { margin-bottom: 2rem; }
  .header h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.3px; color: var(--accent); }
  .header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* API KEY SECTION */
  .api-section {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
  }
  .api-row { display: flex; gap: 8px; align-items: center; }
  .api-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .api-input {
    flex: 1; background: var(--surface2); border: 0.5px solid var(--border);
    border-radius: 7px; padding: 8px 12px; font-size: 13px;
    font-family: var(--mono); color: var(--text); outline: none;
    transition: border-color 0.15s;
  }
  .api-input:focus { border-color: var(--accent-dim); }
  .api-status { font-size: 11px; font-family: var(--mono); }
  .api-status.ok { color: var(--green); }
  .api-status.err { color: var(--red); }

  /* SANDBOX SECTION */
  .sandbox-section {
    background: #141414;
    border: 0.5px solid var(--purple);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1.25rem;
  }
  .sandbox-title { font-size: 12px; color: var(--purple); font-family: var(--mono); margin-bottom: 8px; display: block; }
  .sandbox-input {
    width: 100%; padding: 8px; font-size: 13px; background: #000; border: 0.5px solid #333;
    border-radius: 6px; color: var(--text); font-family: var(--font); margin-bottom: 8px;
    resize: none; min-height: 60px;
  }

  /* UPLOAD & CONTROLS */
  .upload-zone {
    border: 0.5px dashed var(--border2);
    border-radius: var(--radius);
    padding: 1.5rem;
    text-align: center;
    cursor: pointer;
    background: var(--surface);
    margin-bottom: 1rem;
  }
  .upload-zone:hover { border-color: var(--accent-dim); background: var(--surface2); }
  
  .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
  .group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  select, textarea {
    width: 100%; padding: 9px 10px; font-size: 13px;
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 7px; color: var(--text); outline: none;
  }

  .run-btn {
    width: 100%; padding: 11px; margin-top: 1rem;
    background: var(--surface2); border: 0.5px solid var(--border2);
    border-radius: var(--radius); font-size: 14px; color: var(--accent);
    cursor: pointer; transition: all 0.1s;
  }
  .run-btn:hover { background: #2a2a2a; }
  .run-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* LOG & RESULT */
  .log-box { margin-top: 1rem; border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .log-head { padding: 7px 12px; background: var(--surface); font-size: 12px; color: var(--muted); border-bottom: 0.5px solid var(--border); font-family: var(--mono); display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #444; }
  .dot.busy { background: #c8a04a; animation: pulse 0.9s infinite; }
  .dot.ok { background: var(--green); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .log-body { padding: 8px 12px; max-height: 120px; overflow-y: auto; background: #111; font-family: var(--mono); font-size: 11px; color: #555; }
  
  .result-box { margin-top: 1.25rem; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem; }
  .result-text { font-size: 14px; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
  
  .file-pill { display: inline-flex; align-items: center; gap: 8px; background: #1a2016; border: 0.5px solid #3a4a2a; color: var(--green); padding: 5px 10px; border-radius: 7px; font-size: 13px; margin-bottom: 1rem; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Translation Agent 2.1</h1>
    <p>Claude & Gemini — professional multi-engine translation</p>
  </div>

  <div class="api-section">
    <div class="api-label">Anthropic API Key <span class="api-status" id="claudeStatus"></span></div>
    <div class="api-row">
      <input class="api-input" type="password" id="claudeKey" placeholder="sk-ant-...">
    </div>
  </div>

  <div class="api-section">
    <div class="api-label">Gemini API Key <span class="api-status" id="geminiStatus"></span></div>
    <div class="api-row">
      <input class="api-input" type="password" id="geminiKey" placeholder="AIzaSy...">
    </div>
  </div>

  <div class="sandbox-section">
    <span class="sandbox-title">⚡ Sandbox: Quick Test (Max 200KB)</span>
    <textarea class="sandbox-input" id="testInput" placeholder="Enter short text to test translation..."></textarea>
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <span id="charCount" style="font-size: 10px; color: var(--muted); align-self: center;">0 / 200,000 chars</span>
        <button onclick="runTest()" style="font-size: 11px; padding: 4px 12px; background: var(--purple); border: none; border-radius: 4px; color: white; cursor: pointer;">Test Now</button>
    </div>
  </div>

  <div class="upload-zone" id="zone">
    <div style="font-size: 24px; margin-bottom: 6px;">📄</div>
    <div style="font-size: 14px; color: var(--muted);">Drop file for batch translation</div>
  </div>
  <input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.html,js">

  <div id="pill" style="display:none" class="file-pill">
    <span id="pillName"></span>
    <button onclick="clearFile()" style="background:none; border:none; color:var(--green); cursor:pointer;">✕</button>
  </div>

  <div class="controls">
    <div class="group">
      <label>Source Language</label>
      <select id="src">
        <option value="auto">Auto-detect</option>
        <option value="Vietnamese">Vietnamese</option>
        <option value="English">English</option>
        <option value="Chinese">Chinese</option>
        <option value="Japanese">Japanese</option>
      </select>
    </div>
    <div class="group">
      <label>Target Language</label>
      <select id="tgt">
        <option value="Vietnamese">Vietnamese</option>
        <option value="English" selected>English</option>
        <option value="Chinese">Chinese</option>
        <option value="Japanese">Japanese</option>
      </select>
    </div>
    <div class="group">
      <label>Model</label>
      <select id="modelSelect">
        <optgroup label="Anthropic">
          <option value="claude-sonnet-4-6">Claude 4.6 Sonnet</option>
          <option value="claude-haiku-4-5-20251001">Claude 4.5 Haiku</option>
        </optgroup>
        <optgroup label="Google Gemini">
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        </optgroup>
      </select>
    </div>
  </div>

  <div class="group">
    <label>Main Text Content</label>
    <textarea id="inputText" style="min-height: 120px;" placeholder="File content will appear here..."></textarea>
  </div>

  <button class="run-btn" id="runBtn" onclick="runTranslation()">Translate ↗</button>

  <div class="log-box">
    <div class="log-head">
      <span class="dot" id="dot"></span>
      <span id="statusTxt">ready</span>
    </div>
    <div class="log-body" id="logBody">
      <div>> awaiting input...</div>
    </div>
  </div>

  <div class="result-box" id="resultBox" style="display:none">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
      <span style="font-size:12px; color:var(--muted); font-family:var(--mono);">// result</span>
      <button onclick="copyResult()" style="font-size:11px; background:none; border:0.5px solid var(--border); color:var(--accent); cursor:pointer; padding:2px 8px;">Copy</button>
    </div>
    <div class="result-text" id="resultText"></div>
  </div>

</div>

<script>
const CHUNK_SIZE = 12000;
const MAX_TEST_SIZE = 200000; // 200KB limit
const MAX_TOKENS = 4096; // Giảm một nửa theo yêu cầu trước đó

// Char counter for Sandbox
document.getElementById('testInput').addEventListener('input', (e) => {
    const len = e.target.value.length;
    document.getElementById('charCount').textContent = `${len.toLocaleString()} / 200,000 chars`;
    if (len > MAX_TEST_SIZE) {
        document.getElementById('charCount').style.color = 'var(--red)';
    } else {
        document.getElementById('charCount').style.color = 'var(--muted)';
    }
});

async function callAI(model, system, text) {
  const isGemini = model.startsWith('gemini');
  
  if (isGemini) {
    const key = document.getElementById('geminiKey').value.trim();
    if (!key) throw new Error("Missing Gemini API Key");
    
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: `${system}\n\nText to translate:\n${text}` }] }],
        generationConfig: { maxOutputTokens: MAX_TOKENS }
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.candidates[0].content.parts[0].text;
  } else {
    const key = document.getElementById('claudeKey').value.trim();
    if (!key) throw new Error("Missing Claude API Key");
    
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ 
          model, 
          max_tokens: MAX_TOKENS, 
          system, 
          messages: [{ role: 'user', content: text }] 
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.content[0].text;
  }
}

async function runTest() {
    const text = document.getElementById('testInput').value.trim();
    if (!text) return log('Sandbox: No text to test', 'er');
    if (text.length > MAX_TEST_SIZE) return log('Sandbox: Text exceeds 200KB limit', 'er');
    
    document.getElementById('inputText').value = text;
    log('Sandbox data moved to main engine...', 'ok');
    runTranslation();
}

async function runTranslation() {
  const text = document.getElementById('inputText').value.trim();
  if (!text) return log('No text provided', 'er');

  const src = document.getElementById('src').value;
  const tgt = document.getElementById('tgt').value;
  const model = document.getElementById('modelSelect').value;

  /* ============================================================
     PHẦN GỬI PROMPT ĐỂ THỰC HIỆN YÊU CẦU DỊCH THUẬT:
     Dòng lệnh 'system' dưới đây định nghĩa vai trò và nhiệm vụ cho AI. 
     Nó kết hợp ngôn ngữ nguồn (src) và ngôn ngữ đích (tgt).
     ============================================================
  */
  const srcNote = src === 'auto' ? 'detect the source language' : `translate from ${src}`;
  const system = `You are a professional translator. Please ${src} to ${tgt}. The text could consist parts from many different languages, please do NOT translate anything that is NOT written in ${src}. Please output the same text with the part that is written in ${src} be replaced by the translated version in ${tgt} . Please do not add any preamble or explanation. Absolutely make sure to Maintain the original formatting.`;

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  setDot('busy', 'translating...');
  
  try {
    log(`Starting translation (${src} -> ${tgt}) with ${model}...`);
    const out = await callAI(model, system, text);
    
    document.getElementById('resultText').textContent = out;
    document.getElementById('resultBox').style.display = 'block';
    log('Translation complete!', 'ok');
    setDot('ok', 'done');
  } catch (err) {
    log('Error: ' + err.message, 'er');
    setDot('err', 'failed');
  }
  btn.disabled = false;
}

// UI Helpers
function log(msg, cls = '') {
  const el = document.getElementById('logBody');
  const d = document.createElement('div');
  d.style.color = cls === 'er' ? 'var(--red)' : (cls === 'ok' ? 'var(--green)' : '#555');
  d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function setDot(state, label) {
  document.getElementById('dot').className = 'dot' + (state ? ' ' + state : '');
  document.getElementById('statusTxt').textContent = label;
}

function clearFile() {
  document.getElementById('pill').style.display = 'none';
  document.getElementById('inputText').value = '';
}

function copyResult() {
  navigator.clipboard.writeText(document.getElementById('resultText').textContent);
  alert('Copied!');
}

// File Upload Logic
const zone = document.getElementById('zone');
const fi = document.getElementById('fileInput');
zone.onclick = () => fi.click();
fi.onchange = e => {
  const f = e.target.files[0];
  if (f) {
    const r = new FileReader();
    window.currentFileExtension = f.name.split('.').pop();
    r.onload = ev => {
      document.getElementById('inputText').value = ev.target.result;
      document.getElementById('pillName').textContent = f.name;
      document.getElementById('pill').style.display = 'inline-flex';
      log(`File loaded: ${f.name}`);
    };
    r.readAsText(f);
  }
};
</script>
</body>
</html>
